name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build static website
        run: node scripts/build-static.mjs

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: a9e8964b68f403c591c2bc3aa376b481
          command: pages deploy dist --project-name=caikeji-crystal-3d --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Report missing deployment token
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Add the CLOUDFLARE_API_TOKEN repository secret, then run this workflow again."
